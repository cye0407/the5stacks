<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: #171717;
    color: #FAFAFA;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 56px;
  }
  .pillar {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #737373;
    margin-bottom: 12px;
  }
  .quote {
    font-size: 46px;
    font-weight: 700;
    line-height: 1.2;
    max-width: 900px;
    color: #FAFAFA;
  }
  .subtext {
    font-size: 20px;
    font-weight: 400;
    line-height: 1.6;
    color: #A3A3A3;
    max-width: 780px;
    margin-top: 24px;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark-icon {
    width: 44px;
    height: 44px;
    background: #FAFAFA;
    color: #171717;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  .mark-text {
    font-size: 16px;
    font-weight: 600;
    color: #A3A3A3;
  }
  .url {
    font-size: 15px;
    font-weight: 500;
    color: #737373;
  }
</style>
</head>
<body>
  <div>
    <div class="pillar">THE BROKEN</div>
    <div class="quote">The report was never designed to change anything. It was designed to exist.</div>
    <div class="subtext">You spent real money on it. And nothing changed. Because a report is a photograph of a building, not a renovation.</div>
  </div>
  <div class="bottom">
    <div class="mark">
      <div class="mark-icon">5S</div>
      <div class="mark-text">The Five Stacks</div>
    </div>
    <div class="url">the5stacks.com</div>
  </div>
</body>
</html>
