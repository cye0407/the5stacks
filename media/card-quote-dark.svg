<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'DM Sans', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Dark band background like the hero-band on the site -->
  <rect width="1200" height="627" fill="#171717"/>

  <!-- Pillar label -->
  <text x="600" y="140" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">THE BROKEN</text>

  <!-- Main quote — centered, like the hero -->
  <text x="600" y="230" fill="#FAFAFA" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="-0.5">
    <tspan x="600" dy="0">The report was never designed</tspan>
    <tspan x="600" dy="52">to change anything.</tspan>
    <tspan x="600" dy="52">It was designed to exist.</tspan>
  </text>

  <!-- Subtext — muted, like hero-band p -->
  <text x="600" y="410" fill="#A3A3A3" font-size="15" font-weight="400" text-anchor="middle">
    <tspan x="600" dy="0">Most sustainability programs don't survive the next budget review.</tspan>
    <tspan x="600" dy="24">Not because sustainability doesn't matter — because it was positioned</tspan>
    <tspan x="600" dy="24">as an obligation instead of an advantage.</tspan>
  </text>

  <!-- Bottom bar -->
  <rect x="80" y="555" width="28" height="28" rx="6" fill="#FAFAFA"/>
  <text x="94" y="574" fill="#171717" font-size="12" font-weight="700" text-anchor="middle">5S</text>
  <text x="120" y="574" fill="#737373" font-size="12" font-weight="500">The Five Stacks Framework</text>
  <text x="1120" y="574" fill="#737373" font-size="12" font-weight="500" text-anchor="end">the5stacks.com</text>
</svg>
