<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'DM Sans', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#FAFAFA"/>

  <!-- Top label -->
  <text x="80" y="60" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="3">THE FIVE STACKS FRAMEWORK</text>

  <!-- Title -->
  <text x="80" y="104" fill="#171717" font-size="32" font-weight="700" letter-spacing="-0.5">Five stacks. Each one funds the next.</text>

  <!-- Subtitle -->
  <text x="80" y="136" fill="#737373" font-size="15" font-weight="400">Each stack delivers value independently. Each stack earns the investment for the next.</text>

  <!-- Stack cards — white surface, 1px border, dark number badge -->
  <!-- Horizontal line separator -->
  <line x1="80" y1="160" x2="1120" y2="160" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Stack 1 -->
  <rect x="80" y="172" width="1040" height="72" rx="0" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="100" y="188" width="32" height="32" rx="8" fill="#171717"/>
  <text x="116" y="210" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="152" y="203" fill="#171717" font-size="16" font-weight="700">The Defensible Baseline</text>
  <text x="152" y="224" fill="#737373" font-size="13" font-weight="400" font-style="italic">"If it can't be measured, it can't be defended."</text>

  <!-- Stack 2 -->
  <rect x="80" y="252" width="1040" height="72" rx="0" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="100" y="268" width="32" height="32" rx="8" fill="#171717"/>
  <text x="116" y="290" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="152" y="283" fill="#171717" font-size="16" font-weight="700">Operational Efficiency</text>
  <text x="152" y="304" fill="#737373" font-size="13" font-weight="400" font-style="italic">"Fix leaks before adding initiatives."</text>

  <!-- Stack 3 -->
  <rect x="80" y="332" width="1040" height="72" rx="0" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="100" y="348" width="32" height="32" rx="8" fill="#171717"/>
  <text x="116" y="370" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="152" y="363" fill="#171717" font-size="16" font-weight="700">Margin Recovery</text>
  <text x="152" y="384" fill="#737373" font-size="13" font-weight="400" font-style="italic">"What you discard is lost margin."</text>

  <!-- Stack 4 -->
  <rect x="80" y="412" width="1040" height="72" rx="0" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="100" y="428" width="32" height="32" rx="8" fill="#171717"/>
  <text x="116" y="450" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text x="152" y="443" fill="#171717" font-size="16" font-weight="700">Structural Resilience</text>
  <text x="152" y="464" fill="#737373" font-size="13" font-weight="400" font-style="italic">"Systems must absorb shocks without breaking."</text>

  <!-- Stack 5 — inverted (dark) like the site's "Profitable" card -->
  <rect x="80" y="492" width="1040" height="72" rx="0" fill="#171717"/>
  <rect x="100" y="508" width="32" height="32" rx="8" fill="#FFFFFF"/>
  <text x="116" y="530" fill="#171717" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text x="152" y="523" fill="#FFFFFF" font-size="16" font-weight="700">The Compounding Engine</text>
  <text x="152" y="544" fill="#A3A3A3" font-size="13" font-weight="400" font-style="italic">"Build systems that improve as they operate."</text>

  <!-- Bottom bar -->
  <rect x="80" y="585" width="28" height="28" rx="6" fill="#171717"/>
  <text x="94" y="604" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">5S</text>
  <text x="120" y="604" fill="#A3A3A3" font-size="12" font-weight="500">the5stacks.com</text>
  <text x="1120" y="604" fill="#A3A3A3" font-size="12" font-weight="500" text-anchor="end">© 2026 Cat Yeldi</text>
</svg>
