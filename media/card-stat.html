<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: #FAFAFA;
    color: #171717;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 56px 80px;
    position: relative;
  }
  .stat {
    font-size: 120px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    margin-bottom: 16px;
  }
  .label {
    font-size: 26px;
    font-weight: 500;
    color: #404040;
    max-width: 640px;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .context {
    font-size: 17px;
    color: #A3A3A3;
    max-width: 560px;
    line-height: 1.6;
  }
  .bottom {
    position: absolute;
    bottom: 48px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark-icon {
    width: 40px;
    height: 40px;
    background: #171717;
    color: #FAFAFA;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  .mark-text {
    font-size: 14px;
    font-weight: 500;
    color: #A3A3A3;
  }
  .pillar {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A3A3A3;
  }
</style>
</head>
<body>
  <div class="stat">120</div>
  <div class="label">Pages in a sustainability report nobody reads.</div>
  <div class="context">Three months. One consultant. Zero operational changes. The report exists to satisfy an audit — not to improve your business.</div>
  <div class="bottom">
    <div class="mark">
      <div class="mark-icon">5S</div>
      <div class="mark-text">The Five Stacks</div>
    </div>
    <div class="pillar">THE BROKEN</div>
  </div>
</body>
</html>
