<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'DM Sans', Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Light background like site sections -->
  <rect width="1200" height="627" fill="#FAFAFA"/>

  <!-- Option A / Option B layout like on the site -->
  <text x="600" y="56" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">THE REFRAME</text>

  <text x="600" y="100" fill="#171717" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="-0.5">Stop Making Sustainability a Performance</text>

  <!-- Two columns — Option A (light) vs Option B (dark) -->
  <!-- Option A -->
  <rect x="80" y="140" width="510" height="340" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="112" y="176" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="2">OPTION A: THE OBLIGATION</text>
  <text x="112" y="210" fill="#737373" font-size="15" font-weight="400">
    <tspan x="112" dy="0">Treat it as a cost. Hire a consultant.</tspan>
    <tspan x="112" dy="26">File the report. Check the box.</tspan>
    <tspan x="112" dy="26">Resent the expense.</tspan>
    <tspan x="112" dy="40">Wait for the next budget review</tspan>
    <tspan x="112" dy="26">to kill it.</tspan>
  </text>

  <!-- Option B — inverted -->
  <rect x="610" y="140" width="510" height="340" fill="#171717"/>
  <text x="642" y="176" fill="#A3A3A3" font-size="11" font-weight="600" letter-spacing="2">OPTION B: THE ADVANTAGE</text>
  <text x="642" y="210" fill="#D4D4D4" font-size="15" font-weight="400">
    <tspan x="642" dy="0">Use it as a lens. Find the margin leaks.</tspan>
    <tspan x="642" dy="26">Capture the wasted value.</tspan>
    <tspan x="642" dy="26">Build the resilience.</tspan>
    <tspan x="642" dy="40">Let the compliance come as a</tspan>
    <tspan x="642" dy="26">byproduct of better operations.</tspan>
  </text>

  <!-- "This book is Option B." -->
  <text x="600" y="520" fill="#171717" font-size="16" font-weight="700" text-anchor="middle">This book is Option B.</text>

  <!-- Bottom bar -->
  <rect x="80" y="560" width="28" height="28" rx="6" fill="#171717"/>
  <text x="94" y="579" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">5S</text>
  <text x="120" y="579" fill="#A3A3A3" font-size="12" font-weight="500">The Five Stacks Framework</text>
  <text x="1120" y="579" fill="#A3A3A3" font-size="12" font-weight="500" text-anchor="end">the5stacks.com</text>
</svg>
